name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb?schema=public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar o projeto inteiro
        run: npm ci

      - name: Gerar o client do Prisma
        working-directory: apps/api
        run: npx prisma generate

      - name: Compilar (confere os tipos)
        run: npm run build -w apps/api

      - name: Aplicar as migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Testes
        run: npm run test -w apps/api

      - name: Testes de ponta a ponta
        run: npm run test:e2e -w apps/api

      - name: Lint
        run: npm run lint -w apps/api
